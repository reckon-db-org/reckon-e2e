name: ci

# reckon-e2e CI. Runs the torture suites on push to main and on PRs.
#
# Runs on GitHub Actions (GitHub is canonical since 2026-07-26).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  torture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The house OTP and rebar3, exactly (it was a 26.2/27.0 matrix on
      # rebar3 3.22.1).
      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.4.3'
          rebar3-version: '3.27.0'
          version-type: strict

      # The hex package cache only, never _build: a cached _build restores
      # stale beams, and rebar3 runs test modules from the build path.
      - name: Cache hex packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/rebar3
          key: rebar3-otp28.4.3-${{ hashFiles('rebar.config', 'apps/*/rebar.config') }}

      - name: Compile
        run: rebar3 compile

      - name: Run torture suites
        run: rebar3 ct

      - name: Upload CT logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ct-logs
          path: _build/test/logs
          retention-days: 7
